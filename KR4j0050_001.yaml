body:
  text: 龍洲詞宋劉過撰六州歌頭弔武穆鄂王忠烈廟中興諸將誰是萬人英身草莽人雖死氣填膺尚如生年少起河北劍三尺弓兩石定襄漢開虢洺洗洞庭北望帝京狡兔依然在良犬先烹過舊時營壘荆鄂有遺民憶故將軍淚如傾說當年事知恨苦不奉詔僞耶真臣有罪陛下聖可鑒臨一片心萬古分茅土終不到舊姦臣人世猶白日照忽開明衮佩冕圭百拜九原下榮感君恩看年年三月滿地野花春鹵簿迎神又淮西帥李諶和仍為書廟額髙皇神武善駕馭豪英制海內驅羣盜命天膺救蒼生奈夢繞沙漠隔溫凊屈和好召大將㱕兵柄列樞庭公指汴京威已振河洛不顧身烹失一時幾㑹嗟屠毒吾民痛嶽家軍孰扶傾久沉寃憤七十載還復遇帝王真表遺烈錫王號日照臨激士心始識安劉計寧禍已是忠臣我乘傳訪壁壘想精明英氣凛然若在仍題扁昭揭天恩笑原頭荒草一死不能春交怨人神又鎮長淮一都㑹古揚州升平日朱簾十里春風小紅樓誰知艱難去風塵暗邊馬擾笙歌散衣冠渡使人愁屈指細思血戰成何事萬戶封侯但瓊花無恙開落幾經秋故壘荒丘似含羞悵望金陵宅丹陽郡山不斷綢繆興亡夢榮枯淚水東流甚時休野竈炊煙裏依然是宿貔貅嘆燈火今蕭索尚淹留莫上醉翁亭看濛濛雨楊栁絲柔笑書生無用冨貴拙身謀騎鶴來遊沁園春代壽韓平原玉帶金魚緑鬢朱顔神仙畫圖把擎天柱石空留緑野濟川舟楫閒倚西湖天欲安劉公歸重趙許大元勛誰得如平章看直人如伊吕世似唐虞不須别樣規模但收攬人才多用儒況自昔軍中膽能寒敵而今胸次氣欲吞吳紫府真人黑頭元宰收斂神功寂似無㱕來好正芝香棗熟鶴瘦松癯又張路分秋閲作萬馬不嘶一聲寒角令行栁營見秋原如掌鎗刀突出星馳鐵騎陳勢縱橫人在油幢我韜總制羽扇從容裘帶輕君知否是山西將種曽繫詩名龍蛇紙上飛騰看落筆四簷風雨驚便塵沙出塞封侯萬里印金如斗未愜平生拂試腰間吹毛劍在不斬樓蘭心不平㱕來晚聽隨車鼓吹也帶邉聲又送辛幼安弟赴桂林官天下稼軒文章有弟看來未遲正三齊盜起兩河民散勢傾上國泛泛如杯猛士雲飛邊人灰滅幾㑹之來人共知何為者望桂林西去一騎星馳離筵不用多悲喚紅袖佳人分藕絲種黃柑千戶梅花萬里等閒遊戲畢竟男兒入幕來南籌邉如北翻覆手高來去棊公餘且盡玉簮朱履倩米元暉又寄辛稼軒古豈無人可以似吾稼軒者誰擁七州都督雖然陶侃機明神鑒未必能詩常衮何如公羊聊爾千騎東方候㑹稽中原事總胸奴未滅畢竟男兒平生出處天知算整頓乾坤終有時問湖南賓客侵尋去矣江西戶口流落何之盡日樓臺四邉屏障目斷江山魂欲飛長安道算世無劉表王粲疇依又寄孫竹湖問訊竹湖竹如之何如何未㱕道吳山越水無非佳處來無定止去亦何之只怕秋來未能忘耳心與輕雲一樣飛愁無奈但北窗寄傲南澗題詩人生萬事成癡算世上久無公是非恨雲臺突兀無君子者雪堂流落有美人兮疏雨梧桐微雲河漢鐘鼎山林無限悲陽山縣時昌黎誤汝汝誤昌黎又盧菊澗座上時座中有新第宗室一劍橫空飛過洞庭又為此來有汝陽璡者唱名殿陛玉川公子開宴樽罍四舉無成十年不調大宋神仙劉秀才如何好將百千萬事付兩三杯未嘗戚戚于懷歎自古英雄安在哉看錢塘江上潮生潮落姑蘇城裏花謝花開道號書生强名舉子漸老雪從頭上催誰羡汝擁三千珠履十二金叉又寄辛承㫖時承㫖招不赴一注或作風雪中欲詣稼軒久寓湖上未能往賦此以解斗酒彘肩風雨渡江豈不快哉被香山居士約林和靖與坡仙老駕勒吾回坡謂西湖正如西子濃抹淡粧臨照臺二公者皆掉頭不顧只管傳杯白云天竺去來圖畫裏崢嶸樓閣開愛縱橫二澗東西水繞兩峯南北高下雲堆逋曰不然暗香浮動不若孤山先訪梅須晴去訪稼軒未晚且此徘徊又送人赴營道宰萬里湖南江山歷歷此吾舊遊看飛鳬仙子張帆直上周郎赤壁鸚鵡滄洲盡吸西江醉中橫笛人在嶽陽樓上頭波瀾靜泛洞庭青草東整蘭舟長沙㑹府風流有萬戶娉婷簾玉鈎恨楚城春晚岸花檣燕還將客送不是人留且喚陽城更招元結摩撫三關歌詠休心期處算世間真有騎鶴揚州又贈豐城王禹錫自注銅瓶作梅花供尊前數枝說邉頭舊事人生消得幾畨行役問我何之小隊紅旗黃金作印直待封侯知幾時杯行處想淋漓一醉明日東西如掾健筆鸞飛重為寫春風陌上詞便平生豪氣消磨酒裏世間此樂兒輩爭知霜冷貂裘夜寒如水飲到月斜猶未歸仙山路有笙簧度曲聲到琴絲又遊湖栁思花情湖山應怪先生又來想舊時談舌依然解便六丁奔走驅斥風雷翠袖傳觴金貂換酒痛飲何妨三百杯人間世算謫仙去後誰是天才碧窗畫鼓船齊胸次與乾坤一樣開試雲間招手下呼餘子逡巡去矣但覺塵埃若是花時無風無雨一日須來一百回教人道任玉山自倒不用人推又蘇州黃尚書同夫人春聚遊報恩寺緩轡徐驅兒童聚觀神仙畫圖放芹泥雨過芹香路軟金蓮自策小小籃輿傍栁題詩穿花勸酒嗅蕊攀條得自如山行處有松篁夾道不用傳呼清泉石下盤紆算風景江淮各異殊記東坡賦好紗籠舊壁西山句妙簾捲晴虛白玉堂深黃金印大無此文君載後車杯行處想淋漓醉墨真草行書又美人指甲銷薄春氷碾輕寒玉漸長漸彎見鳳鞋泥汚偎人強剔龍涎香斷撥火輕翻學撫瑶琴時時欲翦更掬水魚鱗波底寒纎柔處試摘花香滿鏤棗成斑時將粉淚偷彈記綰玉曾教栁傅看算恩情相著搔便玉體歸期暗數畫遍闌干每到相思沉吟靜處斜倚朱唇皓齒間風流甚把仙郎暗搯莫放春閒又美人足洛浦凌波為誰微步輕塵暗生記踏花芳徑亂紅不損步苔幽砌嫩緑無痕襯玉羅慳銷金樣窄載不起盈盈一段春嬉遊倦笑教人欵捻微褪些跟有時自度歌聲悄不覺微尖㸃拍頻憶金蓮移換文鴛得侣繡茵催衮舞鳳輕分懊恨深遮牽情半露出沒風前煙縷裙知何似似一鈎新月淺碧籠雲八聲甘州送湖北招撫吳獵問紫嵓去後漢公卿不知幾貂蟬誰能借留侯筯著祖生鞭依舊塵沙萬里河洛染腥羶誰識道山客衣鉢曾傳共記玉堂對策欲先明大義次第籌邉况重湖八桂袖手已多年望中原馳驅去也擁十州牙纛正翩翩春風早看東南王氣飛繞星躔四犯剪梅花上建康錢太郎壽水殿風凉賜環㱕正是夢熊華旦解連環叠雪羅輕稱雲章題扇醉蓮萊西清侍宴望黃傘日華寵輦雪獅兒金劵三王玉堂四世帝恩偏眷醉蓬萊臨安龍飛鳯舞信神明有後竹梧隂滿解連環笑折花看槖荷香紅潤醉蓬萊功名歲晚帶河與礪山長逺雪獅兒麟脯杯行狨韉坐穩內家宣勸醉蓬萊小桃紅在襄州作畫譜注詠美人眉曉一作晚非入紗窗靜戲㺯菱花鏡翠袖輕勻玉纖彈去小妝紅粉畫行人愁外兩青山與尊前離恨宿酒醺難醒笑記香肩並暖借蓮腮碧雲微透暈睂斜印最多情生怕外人猜拭香津微搵天仙子初赴省别妾于三十里頭或作水仙子誤别酒醺醺容易醉回過頭來三十里馬兒不住去如飛牽一憩坐一憩斷送殺人山與水是則是青山終可喜不道恩情拚得未雪迷村店酒旗斜去則是住則是煩惱自家煩惱你竹香子同郭季端訪舊不遇有作一項窗兒明快料想那人不在薰籠脫下舊衣裳件件香難賽匆匆去得忒㬠這鏡兒也不曽蓋千朝百日不曾來沒這些兒箇采賀新郎彈鋏西來路記匆匆經行數日幾番風雨夢裏尋秋秋不見秋在平蕪逺渚想雁信家山何處萬里西風吹客鬢把菱花自笑人憔悴留不住少年去男兒事業無慿據記當年擊筑悲歌酒酣箕踞腰下光芒三尺劍時解挑燈夜語更忍對燈花彈淚喚起杜陵風雨手寫江東渭北相思句歌此恨慰羇旅又贈鄉人米唐卿多病劉郎瘦最傷心天寒歲晚客他鄉久大舸翩翩何許至元是高陽舊友便一笑相歡㩦手與問武昌城下月又何如揚子江頭栁追往事兩眉皺燭花自剪明如晝喚青娥小紅樓上殷勤勸酒昵昵琵琶恩怨語春筍輕籠翠袖看舞徹金叉微溜若見故鄉吾父老道長安市上強如舊重㑹面幾時又又贈張彥功曉印霜花步夢半醒扶上雕鞍馬嘶人去嵐濕青絲雙轡冷暖控野梅江路聽畫角吹殘更鼓悲壯寒聲撩客恨甚貂裘重擁愁無數霜月白照離緒青樓回首家何處早山遙水闊天低斷腸煙樹誰念天涯牢落况輕負暖煙濃雨記酒醒香銷時語客裏歸韀須早發怕天寒風急相思苦應看我翠眉聚又遊西湖睡覺啼鶯曉醉西湖兩峰日日買花簮帽去盡酒徒無人問唯有玉山自倒任拍手兒童爭笑一舸乘風翩然去避魚龍不見波聲悄歌韵逺喚蘇小神仙路逺蓬萊島紫雲深參差禁時刻缺禁字非樹有煙花繞人世紅塵西障日百計不如歸時刻多去字非好付樂事與他年少費盡栁金梨雪句問沉香亭北何時召心未愜鬢先老又平原納寵姬奏方響席上賦倦舞輪袍後厭秦箏䳄鸞未嫁怨新懷舊别有艷妝豪勢樂春筍微揎翠袖試一曲琅璈初奏莫放珠簾容易捲怕人知世有梨園手雙臂冷釧金瘦燭花對剪明於晝畫堂深曲屏山展灰紅圍獸莫把雙眉依舊皺細語新鶯囀栁聽箭落銅壺銀漏一片雄心天外去為聲清響徹雲霄透人醉也尚呼酒又院宇重重掩醉沉沉亭隂轉午繡簾高捲金鴨香濃噴寶篆驚起雕梁語燕正架上酥醿開遍嫩萼稍頭舒素臉似月娥初試宫妝淺風力嫩異香軟佳人無意拈針線繞朱闌六曲徘徊為他留戀試把芳心輕輕數暗計歸期近逺奈數了依然重怨把酒問春春不管枉教人只恁空腸斷腸斷處怎消遣又自跋云去年秋余試牒四明賦贈老娼至今天下與禁中皆歌之江西人來以為鄧南秀詞非也老去相如倦向文君說似而今怎生消遣衣袂京塵曾染處空有香紅尚軟料彼此魂銷腸斷一枕新凉眠客舍聽梧桐疏雨秋風顫燈暈冷記初見樓低不放珠簾捲晚妝殘翠蛾狼藉淚痕流臉人道愁來須殢酒無奈愁深酒淺但託意焦琴紈扇莫鼓琵琶江上曲怕荻花楓葉俱淒怨雲萬疊寸心逺水龍吟謫仙狂客何如看來畢竟歸田好玉堂無此三山海上虛無縹眇讀罷離騷案香猶在覺人間小任菜花葵麥劉郎去後桃開處皆多少一夜雪迷蘭棹傍寒溪欲尋安道而今縱有劉郎氷柱有知音否想見鸞飛如椽健筆檄書親草算平生白傅風流未肯問香山老念奴嬌回侍郎李大異知音者少算乾坤許大著身無處直待功成方始退何日可尋歸路多景樓前垂虹亭下一枕眠秋雨虛名相誤十年枉費辛苦不是奏賦明光獻書北闕無驚人之語我自匆忙天未肯嬴得衣裙塵土白璧堆前黃金酬笑付與君為主蓴鱸江上浩然明日歸去滿江紅同襄陽帥泛湖獵獵風蒲畫船轉碧波灣浦都不是栁汀桃岸橘洲梅渚指㸃山公騎馬地經由羊祜登山處悄一如人在水晶宫消袢暑薰風動簾帷舉秦箏奏凌波舞拚氷壺沉醉晚凉歸去侵岸一篙楊栁浪過雲幾㸃荷花雨倚樓人十里憑欄杆神仙侣又高帥馮太尉席上敵面輕風一兩㸃海棠微雨春總在英雄元帥曉來遊處樓閣萬家簾幕卷江郊十里旌旗駐有黃鸝百舌囀新聲垂楊舞寒食近笙簫鼓車馬閙銅鞮路拚尊前一醉與花為主風韻可將圖障畫笑談盡是文章路問何如鄒湛赴江頭陪羊祜水調歌頭晚春半一作春春事能幾許密葉著青梅日高花困海棠風急想都開不惜春衣典盡只怕春光歸去片片㸃蒼苔能得幾時好追賞莫徘徊雨飄紅風換翠苦相催人生行樂且須痛飲莫辭杯坐則高談風月醉則恣眠芳草醒後亦佳哉湖上新亭好何事不曾來又刀劍出榆塞鉛槧上蓬山得之渾不費力失亦匹如閒未必古人皆是未必今人俱錯世事沐猴冠老子不分别內外與中間酒須飲詩可作鋏休彈人生行樂何事催彼鬢毛斑達則牙旗金甲窮則蹇驢破帽莫作兩般看世事只如此自有識鵰鸞祝英臺近同妓遊帥司東園窄輕衫聨寶轡花裡控金勒有底風光都在畫欄側日遲春暖融融杏紅深處為花醉一鞭春色對嬌質為我歌捧瑶觴歡聲動阡陌何似多情飛上鬢雲碧晚來約住青驄踏花歸去亂紅碎一庭風月又笑天涯還倦客欲起病無力風雨春歸一日近一日看人結束征衫前呵騎馬腰劍上隴西平策鬢粉白只可歸去家山無田種瓜得空抱遺書憔悴小樓側杜鵑不管人愁月明枝上直啼到枕邉相覓轆轤金井席上贈馬僉判舞姬翠眉重拂後房深自喚小孌嬌小繡帶羅垂報濃妝才了堂虛夜悄但夜約鼓簫聲閙一曲梅花樽前舞徹梨園新調高陽醉山未倒看鞋飛鳳翼叉褪微溜秋滿東湖更西風涼早桃源路杳記流水泛舟曾到桂子香濃梧桐影轉月寒天曉糖多令安逺樓小集侑觴歌板之姬黃其姓者乞詞于龍洲道人為賦此糖多令同栁阜之劉去非石民聸周嘉仲陳孟參孟容時八月五日也譜注重過武昌糖一作唐蘆葉滿汀洲寒沙帶淺流二十年重過南樓栁下繫船猶未穩能幾日又中秋黃鶴斷磯頭故人曾到不舊江山渾是新愁欲買桂花同載酒終不似少年遊臨江仙四景半雨半晴模樣乍寒乍熱天時榴花香逐濕風飛緑雲翻碧浪水急轉前溪誰知清凉意思珊瑚枕冷先知秋光預若借些兒賸催金粟閙素魄好揚輝蝶戀花贈張守寵姬簾幕聞聲歌已妙一曲尊前真個梅花早眉黛兩山誰為掃風流京兆江南少醉得白鬚人自老猶記侯鯖舊也曾年少後夜短蓬霜月曉夢魂依約雲山繞謁金門京口賦與歌者侑尊歸不去船泊早春梅渚試聽玉人歌白苧行雲無覓處剪燭寫詩無語漠漠寒生窗户明日短蓬眠夜雨寶叉空半股又秋興秋無惡愁怯羅衾風弱雨線垂垂晴又落輕烟籠翠箔休道旅人蕭索生怕香濃灰薄桂子莫愁孤酒約詩情元落魄鷓鴣天樓外雲山千萬重畫眉人隔小簾櫳風垂舞栁春猶淺雪㸃酥胸暖未融携手處又相逢夜闌心事與郎同一杯自勸羔兒酒十幅銷金暖帳籠栁梢青送梅坡泛菊杯深吹梅角逺同在京城聚散匆匆雲邉孤雁水上浮萍教人怎不傷情屈指人心幾人後夜相思塵隨馬足月逐舟行好事近詠茶筅誰斫碧琅玕影撼半亭風月尚有嵗寒心在留數根華髮龍孫戲弄碧波濤隨手清風發瀼到浪花深處愛一甌香雪清平樂贈妓忔憎憎地一捻兒年紀待道瘦來肥不是宜著淡黃衫子脣邉一㸃櫻多見人頻斂雙蛾我自金陵懷古唱時休唱西河醉太平閔情潛時刻誤夫情高意真眉長鬢青小樓明月調箏寫春風數聲思君憶君魂牽夢縈翠綃香暖雲屏更那堪酒醒西江月賀詞稼或刻辛軒堂上謀臣樽爼邉頭將士干戈天時地利與人和燕可伐與曰可今日樓臺鼎鼐明年帶礪山河大家齊唱太平歌同日四方來賀龍洲詞
