body:
  text: 龍洲詞詞曲類一詞集之屬提要臣等謹案龍洲詞一巻宋劉過撰過有龍洲集别著録陳振孫書録解題載劉改之詞一巻此本為毛晉所刋題曰龍洲詞從全集之名也黄昇花庵詞選謂改之乃稼軒之客詞多壯語葢學稼軒然過詞凡贈辛棄疾者則學其體如古豈無人可以似吾稼軒者誰等調是也其餘雖跌宕淋漓實未嘗全作辛體陶九成輟耕録又謂改之造詞贍逸有思致沁園春二首尤纎麗可愛今觀集中詠美人指甲美人足二闋刻畫猥䙝頗乖大雅九成乃獨加推許亦未為賞音渚山堂詩話云改之沁園春緑鬢朱顔一闋係代夀韓平原然在當時不知竟代誰作今亦無從詳考觀集中賀新郎第五首註曰平原納寵姬奏方響席上賦則改之且身預南園之宴不止代人祝嘏矣葢縱横游士志在功名固不能規言而矩行亦不必曲為之諱也又沁園春第七首註曰寄辛承㫖時承㫖招不赴又註或作風雪中欲詣稼軒久寓湖上未能一往賦此以解其事甚明中吳紀聞亦稱稼軒帥越聞其名遣价招之不及行因仿辛體作沁園春一詞以寄至樂府紀聞則又謂幼安守京口日改之即敝衣曳履承命賦詩是兩人定交在幼安未帥越之前而山房隨筆載此詞乃稱稼軒帥越東時改之欲見辛不納藉晦庵南軒二人為之地始得進見云云小説流傳事多失實證以本集亦可以訂其誣也乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:3e3e62bd554b9df12d30347d911c02fc43a30febfa4c2a54d7d123a534293235
